<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Delta Health Tech · Brand Guidelines (Print)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  @page { size: 1920px 1080px; margin: 0; }
  html, body {
    margin: 0; padding: 0; background: #fff;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .slide {
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--dh-bone);
    color: var(--dh-ink);
    font-family: var(--dh-font-body);
    padding: 80px 96px;
    display: flex; flex-direction: column;
    position: relative;
    box-sizing: border-box;
    break-after: page;
    page-break-after: always;
    break-inside: avoid;
  }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  @media screen {
    body { background: #eee; padding: 20px 0; }
    .slide {
      margin: 0 auto 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      transform-origin: top center;
    }
  }
</style>
</head>
<body>

<div class="slide" data-slide="cover" style="background: linear-gradient(180deg, #ECFEFF 0%, #FAFBFC 65%, #FFFFFF 100%); padding: 0 96px; justify-content: center;"></div>
<div class="slide" data-slide="manifesto"></div>
<div class="slide" data-slide="concept"></div>
<div class="slide" data-slide="variations"></div>
<div class="slide" data-slide="lockups"></div>
<div class="slide" data-slide="palette"></div>
<div class="slide" data-slide="type"></div>
<div class="slide" data-slide="icons"></div>
<div class="slide" data-slide="components"></div>
<div class="slide" data-slide="hero"></div>
<div class="slide" data-slide="voice"></div>

<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="ui-components.jsx"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel">
  const slides = [
    ["cover",      () => window.SlideCover],
    ["manifesto",  () => window.SlideManifesto],
    ["concept",    () => window.SlideConcept],
    ["variations", () => window.SlideVariations],
    ["lockups",    () => window.SlideLockups],
    ["palette",    () => window.SlidePalette],
    ["type",       () => window.SlideType],
    ["icons",      () => window.SlideIcons],
    ["components", () => window.SlideComponents],
    ["hero",       () => window.SlideHero],
    ["voice",      () => window.SlideVoice],
  ];

  function scaleSlidesToViewport() {
    // On screen, scale each slide to fit the viewport width. Print uses 1:1.
    if (window.matchMedia('print').matches) return;
    const vw = window.innerWidth - 40;
    const s = Math.min(1, vw / 1920);
    document.querySelectorAll('.slide').forEach(el => {
      el.style.transform = `scale(${s})`;
      el.style.marginBottom = `${20 - (1 - s) * 1080}px`;
      el.style.width = '1920px';
    });
  }

  async function mount() {
    // Wait for fonts
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) {}
    }
    slides.forEach(([key, getComp]) => {
      const Comp = getComp();
      if (!Comp) return;
      const el = document.querySelector(`.slide[data-slide="${key}"]`);
      if (!el) return;
      ReactDOM.createRoot(el).render(<Comp />);
    });
    // Give React + fonts a beat, then scale + print
    setTimeout(() => {
      scaleSlidesToViewport();
      window.addEventListener('resize', scaleSlidesToViewport);
      // Auto-print after everything settles
      setTimeout(() => { window.print(); }, 800);
    }, 600);
  }

  setTimeout(mount, 120);
</script>

</body>
</html>
