<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Delta Health Tech · Especialista · Recetas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-tokens.css"/>
<style>
  html, body { margin: 0; height: 100%; background: var(--dh-bone); font-family: var(--dh-font-body); color: var(--dh-ink); }
  #root { height: 100vh; }
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .side { background: #fff; border-right: 1px solid var(--dh-gray-100); padding: 28px 18px; display: flex; flex-direction: column; overflow-y: auto; }
  .side-head { padding: 0 8px 22px; border-bottom: 1px solid var(--dh-gray-100); margin-bottom: 18px; }
  .role { margin-top: 10px; font-size: 11px; font-family: var(--dh-font-mono); color: var(--dh-coral-600); letter-spacing: .08em; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--dh-r-md); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--dh-gray-600); margin-bottom: 2px; border: none; background: transparent; font-family: inherit; width: 100%; text-align: left; text-decoration: none; }
  .nav-item:hover { background: var(--dh-gray-50); }
  .nav-item.active { background: var(--dh-turquoise-50); color: var(--dh-turquoise-700); font-weight: 600; }
  .nav-item .badge { margin-left: auto; background: var(--dh-coral); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--dh-gray-100); display: flex; align-items: center; gap: 10px; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { padding: 18px 36px; border-bottom: 1px solid var(--dh-gray-100); background: #fff; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .crumb { font-size: 13px; color: var(--dh-gray-600); }
  .crumb strong { color: var(--dh-ink); font-weight: 600; }
  main.content { padding: 32px 36px; overflow-y: auto; flex: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="ui-components.jsx"></script>
<script type="text/babel" src="esp-shell.jsx"></script>
<script type="text/babel" src="esp-recetas.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById("root")).render(
  <EspShell active="recetas" crumb="Recetas">
    <RecetasEsp/>
  </EspShell>
);
</script>
</body>
</html>
