name: Deploy (Cloud Run · staging)

# Despliega a Cloud Run desde la rama `staging`.
# Espejo de deploy.yml (producción) con recursos mínimos y una BD propia
# (clon de prod). El backend queda IAM-only (igual que prod); el frontend se
# publica y se sirve por Cloudflare en staging.deltasalud.app.
#
# PRERREQUISITOS DE UNA SOLA VEZ (fuera de este workflow):
#   1. BD de staging: clon de prod →
#      gcloud sql instances clone delta-db delta-db-staging
#      (misma región; conserva usuarios/passwords y el schema/datos).
#   2. Secreto DATABASE_URL_STAGING en Secret Manager, apuntando al socket del
#      clon, p.ej:
#      postgres://delta:<PW>@/deltamedical?host=/cloudsql/sodium-shard-499116-r3:us-east1:delta-db-staging
#   3. Auth0: agregar a la app las URLs de staging
#      (Allowed Callback: https://staging.deltasalud.app/auth/callback,
#       Allowed Logout:   https://staging.deltasalud.app,
#       Allowed Web Origins: https://staging.deltasalud.app).
#   4. Google OAuth client: agregar Authorized redirect URI
#      https://staging.deltasalud.app/api/integrations/google/callback
#   5. Tras el 1er deploy: domain mapping staging.deltasalud.app → delta-frontend-staging
#      + registro DNS en Cloudflare (DNS only, igual que auth.deltasalud.app).
#   6. Crear la rama `staging` y pushear.
#
# NOTA: reusa las MISMAS llaves de cifrado de prod (ENCRYPTION_KEY /
# ENCRYPTION_HMAC_SECRET). Es obligatorio: la BD clonada está cifrada con esa
# llave y no se podría descifrar con otra.
#
# CORREO EN STAGING (cambiado 2026-08-09): EMAIL_DRIVER=resend — staging SÍ envía
# correo de verdad, al destinatario real, para poder probar el flujo completo
# incluyendo a quién le llega. SANDBOX_EMAIL queda SIN definir a propósito: con
# ella, SandboxEmailPort reescribiría el destinatario de cada correo.
#
# ⚠️ La BD de staging es un clon de prod y trae direcciones de pacientes REALES,
# así que un envío disparado sobre datos clonados llega a esa persona. La
# decisión (dueño, 2026-08-09) es asumirlo bajo estas dos condiciones:
#
#   1. A staging solo entran administradores, y el correo se dispara únicamente
#      desde pruebas manuales — no hay tráfico de terceros que lo gatille solo.
#   2. NINGÚN cron corre contra staging. Verificado el 2026-08-09: los dos jobs
#      de Cloud Scheduler (appointment-reminders, doctor-inactivity-notices)
#      apuntan a `delta-backend` (prod), NO a `delta-backend-staging`, y el
#      backend no tiene ningún @Cron interno que se auto-dispare al bootear.
#
# La condición 2 es la que importa: un cron sobre las citas clonadas mandaría
# correo EN LOTE a pacientes reales sin que nadie lo pida. Si algún día se apunta
# un scheduler a staging, hay que volver a poner SANDBOX_EMAIL antes.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sodium-shard-499116-r3
  REGION: us-east1
  AR: us-east1-docker.pkg.dev/sodium-shard-499116-r3/delta
  SQL_CONN: sodium-shard-499116-r3:us-east1:delta-db-staging
  WIF_PROVIDER: projects/763714620325/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: delta-deployer-sa@sodium-shard-499116-r3.iam.gserviceaccount.com
  BACKEND_SA: delta-backend-sa@sodium-shard-499116-r3.iam.gserviceaccount.com
  FRONTEND_SA: delta-frontend-sa@sodium-shard-499116-r3.iam.gserviceaccount.com
  GCS_BUCKET: delta-files-sodium-shard-499116-r3
  STAGING_URL: https://staging.deltasalud.app
  IMG_TAG: staging-${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Guarda fail-closed: staging manda correo real al destinatario real sobre
      # una BD clonada de prod. Eso es tolerable SOLO mientras ningún cron corra
      # contra staging — un scheduler apuntado acá mandaría correo en lote a
      # pacientes reales sin que nadie lo pida. Va apenas hay gcloud disponible
      # y antes del build/migraciones, para no gastarlos en un deploy que igual
      # va a abortar.
      - name: Verify no scheduler targets staging
        run: |
          # El listado tiene que SALIR BIEN para que la guarda valga. Si se
          # tomaba la salida de un gcloud que falló (permisos, API apagada),
          # el grep no encontraba nada y el deploy seguía: fallaba ABIERTA,
          # justo al revés de lo que hace falta acá.
          if ! JOBS=$(gcloud scheduler jobs list --location="$REGION" --format='value(httpTarget.uri)' 2>&1); then
            echo "::error::No se pudo listar los jobs de Cloud Scheduler, así que no se puede garantizar que ninguno apunte a staging. Staging manda correo REAL a destinatarios REALES sobre una BD clonada de producción. Detalle: ${JOBS}"
            exit 1
          fi
          if echo "$JOBS" | grep -q 'delta-backend-staging'; then
            echo "::error::Hay un job de Cloud Scheduler apuntando al backend de staging. Staging envía correo REAL a destinatarios REALES sobre una BD clonada de producción: un cron acá dispara correo en lote a pacientes de verdad. Reapuntá o borrá ese job, o definí SANDBOX_EMAIL para redirigir el correo, antes de volver a desplegar."
            exit 1
          fi
          echo "Ningún scheduler apunta a staging — el correo solo sale de pruebas manuales."

      # --- 1) Build & push both images (staging-tagged) ---------------------
      - name: Build & push images
        run: |
          gcloud builds submit --config cloudbuild.yaml \
            --substitutions=_TAG=$IMG_TAG,_NP_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }},_NP_URL=$STAGING_URL \
            .

      # --- 2) DB migrations against the STAGING clone -----------------------
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run migrations (staging DB)
        run: |
          # Versión de cloud-sql-proxy FIJADA a v2 (existe en el bucket, verificado 200).
          # NO usar 'releases/latest' de GitHub: puede devolver un backport de la línea v1
          # (p.ej. v1.38.2) cuyo binario NO existe en este bucket → curl -f falla con 404.
          VER=v2.23.0
          curl -fLo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${VER}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$SQL_CONN" &
          for i in $(seq 1 30); do nc -z 127.0.0.1 5432 && break; sleep 1; done
          PW=$(gcloud secrets versions access latest --secret=DB_PASSWORD)
          export NODE_ENV=production
          export DATABASE_URL="postgres://delta:${PW}@127.0.0.1:5432/deltamedical"
          pnpm nx run backend:migrate

      # --- 3) Deploy backend-staging (IAM-protected; not public) ------------
      - name: Deploy backend
        run: |
          gcloud run deploy delta-backend-staging \
            --image="$AR/backend:$IMG_TAG" \
            --region="$REGION" --service-account="$BACKEND_SA" \
            --no-allow-unauthenticated \
            --add-cloudsql-instances="$SQL_CONN" \
            --set-secrets=DATABASE_URL=DATABASE_URL_STAGING:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,ENCRYPTION_HMAC_SECRET=ENCRYPTION_HMAC_SECRET:latest,AUTH_RESOLVE_SECRET=AUTH_RESOLVE_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,CRON_SECRET=CRON_SECRET:latest,REVIEWER_PASSWORD=REVIEWER_PASSWORD:latest,REVIEWER_SESSION_SECRET=REVIEWER_SESSION_SECRET:latest \
            --set-env-vars=NODE_ENV=production,AUTH_MODE=auth0,AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }},AUTH0_CLIENT_ID=${{ vars.AUTH0_CLIENT_ID }},AUTH0_ROLE_NAMESPACE=${{ vars.AUTH0_ROLE_NAMESPACE }},REDIS_DISABLED=true,DB_POOL_MAX=5,DB_POOL_MIN=0,STORAGE_DRIVER=gcs,GCS_BUCKET=$GCS_BUCKET,GCS_PROJECT_ID=$PROJECT_ID,EMAIL_DRIVER=resend,EMAIL_FROM=noreply@deltasalud.app,SANDBOX=false,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},SENTRY_ENABLED=false,REVIEWER_ACCESS_ENABLED=${{ vars.REVIEWER_ACCESS_ENABLED }},REVIEWER_EMAIL=demo.google@deltasalud.app,REVIEWER_PROFILE_ID=b938843b-8a93-4281-af29-cc6968fffc7f \
            --memory=512Mi --cpu=1 --min-instances=0 --max-instances=1 --port=8080

      - name: Resolve backend URL + grant frontend invoker
        id: backend
        run: |
          BURL=$(gcloud run services describe delta-backend-staging --region="$REGION" --format='value(status.url)')
          gcloud run services add-iam-policy-binding delta-backend-staging --region="$REGION" \
            --member="serviceAccount:$FRONTEND_SA" --role=roles/run.invoker --quiet
          echo "url=$BURL" >> "$GITHUB_OUTPUT"

      # --- 4) Deploy frontend-staging (public; served via Cloudflare) -------
      - name: Deploy frontend
        id: frontend
        run: |
          BURL="${{ steps.backend.outputs.url }}"
          gcloud run deploy delta-frontend-staging \
            --image="$AR/frontend:$IMG_TAG" \
            --region="$REGION" --service-account="$FRONTEND_SA" \
            --allow-unauthenticated \
            --set-secrets=AUTH0_SECRET=AUTH0_SECRET:latest,AUTH0_CLIENT_SECRET=AUTH0_CLIENT_SECRET:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,AUTH_RESOLVE_SECRET=AUTH_RESOLVE_SECRET:latest \
            --set-env-vars=NODE_ENV=production,AUTH_MODE=auth0,AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }},AUTH0_ISSUER_BASE_URL=https://${{ vars.AUTH0_DOMAIN }}/,AUTH0_CLIENT_ID=${{ vars.AUTH0_CLIENT_ID }},AUTH0_ROLE_NAMESPACE=${{ vars.AUTH0_ROLE_NAMESPACE }},GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},BACKEND_INTERNAL_URL=$BURL,BACKEND_IAM_AUDIENCE=$BURL,REVIEWER_ACCESS_ENABLED=${{ vars.REVIEWER_ACCESS_ENABLED }} \
            --memory=512Mi --cpu=1 --min-instances=0 --max-instances=1 --port=8080
          # Self-referencing runtime vars fixed to the staging public URL.
          gcloud run services update delta-frontend-staging --region="$REGION" \
            --update-env-vars=AUTH0_BASE_URL=$STAGING_URL,APP_BASE_URL=$STAGING_URL,GOOGLE_REDIRECT_URI=$STAGING_URL/api/integrations/google/callback
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"

      - name: Point backend CORS at the staging frontend
        run: |
          gcloud run services update delta-backend-staging --region="$REGION" \
            --update-env-vars=CORS_ORIGIN=$STAGING_URL,APP_BASE_URL=$STAGING_URL,GOOGLE_REDIRECT_URI=$STAGING_URL/api/integrations/google/callback

      - name: Summary
        run: |
          echo "### Deploy STAGING OK :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: $STAGING_URL (run.app: $(gcloud run services describe delta-frontend-staging --region=$REGION --format='value(status.url)'))" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend (IAM, no público): ${{ steps.backend.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EMAIL_DRIVER=resend, al destinatario REAL · Sentry off · min=0/max=1" >> "$GITHUB_STEP_SUMMARY"
