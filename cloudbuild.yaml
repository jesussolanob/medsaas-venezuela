# Builds both images and pushes them to Artifact Registry.
# Used by GitHub Actions and for manual validation:
#   gcloud builds submit --config cloudbuild.yaml --substitutions _TAG=manual
substitutions:
  _AR: us-east1-docker.pkg.dev/sodium-shard-499116-r3/delta
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args: ['build', '-f', 'apps/backend/Dockerfile', '-t', '${_AR}/backend:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args: ['build', '-f', 'apps/frontend/Dockerfile', '-t', '${_AR}/frontend:${_TAG}', '.']

images:
  - '${_AR}/backend:${_TAG}'
  - '${_AR}/frontend:${_TAG}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
