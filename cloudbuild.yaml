# Builds both images and pushes them to Artifact Registry.
# Used by GitHub Actions and for manual validation:
#   gcloud builds submit --config cloudbuild.yaml --substitutions _TAG=manual
substitutions:
  _AR: us-east1-docker.pkg.dev/sodium-shard-499116-r3/delta
  _TAG: latest
  # NEXT_PUBLIC_* are baked into the frontend client bundle at build time.
  _NP_GOOGLE_CLIENT_ID: ''
  _NP_URL: ''
  # Sentry DSN is a publishable ingest key (it ships in the browser bundle).
  _NP_SENTRY_DSN: 'https://e30911e0e2c265f89d7fd9a7fbb24371@o4511532342640640.ingest.us.sentry.io/4511532361777152'

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args: ['build', '-f', 'apps/backend/Dockerfile', '-t', '${_AR}/backend:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - 'build'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_MODE=auth0'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NP_GOOGLE_CLIENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_URL=${_NP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_ENABLED=true'
      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_DSN=${_NP_SENTRY_DSN}'
      - '-t'
      - '${_AR}/frontend:${_TAG}'
      - '.'

images:
  - '${_AR}/backend:${_TAG}'
  - '${_AR}/frontend:${_TAG}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
