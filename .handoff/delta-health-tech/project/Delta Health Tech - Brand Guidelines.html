<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Delta Health Tech · Brand Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="deck-stage.js"></script>
<style>
  /* No-op — sections are appended directly as deck-stage children. */
</style>
</head>
<body>

<deck-stage width="1920" height="1080" id="deck">
  <section data-slide="cover"></section>
  <section data-slide="manifesto"></section>
  <section data-slide="concept"></section>
  <section data-slide="variations"></section>
  <section data-slide="lockups"></section>
  <section data-slide="palette"></section>
  <section data-slide="type"></section>
  <section data-slide="icons"></section>
  <section data-slide="components"></section>
  <section data-slide="hero"></section>
  <section data-slide="voice"></section>
</deck-stage>

<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="ui-components.jsx"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel">
  const slides = [
    ["cover",      window.SlideCover,      "Cover",       { background: "linear-gradient(180deg, #ECFEFF 0%, #FAFBFC 65%, #FFFFFF 100%)", padding: "0 96px", justifyContent: "center" }],
    ["manifesto",  window.SlideManifesto,  "Manifiesto",  null],
    ["concept",    window.SlideConcept,    "Concepto",    null],
    ["variations", window.SlideVariations, "Variaciones", null],
    ["lockups",    window.SlideLockups,    "Lockups",     null],
    ["palette",    window.SlidePalette,    "Paleta",      null],
    ["type",       window.SlideType,       "Tipografía",  null],
    ["icons",      window.SlideIcons,      "Iconografía", null],
    ["components", window.SlideComponents, "Componentes", null],
    ["hero",       window.SlideHero,       "Hero Web",    null],
    ["voice",      window.SlideVoice,      "Voz",         null],
  ];
  setTimeout(() => {
    slides.forEach(([key, Comp, label, styleOverride]) => {
      if (!Comp) return;
      const placeholder = document.querySelector(`section[data-slide="${key}"]`);
      if (!placeholder) return;
      placeholder.setAttribute("data-label", label);
      if (styleOverride) Object.assign(placeholder.style, styleOverride);
      ReactDOM.createRoot(placeholder).render(<Comp />);
    });
  }, 80);
</script>

</body>
</html>
